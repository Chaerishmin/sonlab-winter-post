<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf7ef">
<title>연구실 크리스마스 트리 · Son Lab</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./glitter.css">
</head>
<body>
<div class="postal-edge" aria-hidden="true"></div>
<header class="masthead">
  <div class="wrap mast-inner">
    <h1 class="brand"><img id="brand-mark" width="42" height="42" alt=""><span lang="en">Son Lab</span><i aria-hidden="true"></i><b>겨울 우체국</b></h1>
    <nav aria-label="작업실 메뉴">
      <button class="text-btn" id="name-control" hidden></button>
      <button class="text-btn" id="help-open"><span class="circle-i" aria-hidden="true">?</span>사용 방법</button>
    </nav>
  </div>
</header>
<main id="winter-scene" class="winter-scene" aria-label="연구실 크리스마스 트리 꾸미기">
    <div class="viewport" id="viewport" aria-label="우리 연구실의 트리">
      <canvas id="landscape" aria-hidden="true"></canvas>
      <div id="world" class="world">
        <img id="scenery" width="1380" height="920" alt="눈 덮인 산장과 커다란 전나무" draggable="false">
        <div id="ornaments"></div>
        <button type="button" class="tree-star" id="tree-star" title="교수님의 한마디" aria-label="트리 꼭대기의 별 · 교수님의 한마디" disabled><img id="star-art" alt="" draggable="false"></button>
        <div id="ghost" class="pin ghost" hidden aria-hidden="true"></div>
      </div>
      <div class="placing-tag" id="placing-tag" hidden>걸 위치 고르는 중</div>
    </div>
    <aside id="bench" class="bench" aria-labelledby="bench-title">
      <div class="bench-heading"><span class="red-rule" aria-hidden="true"></span><h2 id="bench-title">장식 작업대</h2></div>

      <div class="choices">
        <button class="choice" data-kind="card"><span class="swatch art-card"><img id="sample-card" alt=""></span><span class="choice-copy"><strong>메시지 카드</strong><small>봉투 속에 남기는 한마디</small></span><span class="add-mark" aria-hidden="true">+</span></button>
        <button class="choice" data-kind="photo"><span class="swatch art-photo"><img id="sample-photo" alt=""></span><span class="choice-copy"><strong>사진 오나먼트</strong><small>원형 사진이나 누끼 키링</small></span><span class="add-mark" aria-hidden="true">+</span></button>
        <button class="choice" data-kind="mol"><span class="swatch art-mol"><img id="sample-mol" alt=""></span><span class="choice-copy"><strong>분자 전구</strong><small>분자 하나 또는 고분자 사슬</small></span><span class="add-mark" aria-hidden="true">+</span></button>
      </div>
      <div class="reply-note"><span class="note-art" aria-hidden="true"><i class="mail-symbol"></i></span><p>마음에 드는 장식이 있다면<br><strong>작은 답장 장식</strong>를 달아줘.</p></div>
      <button type="button" id="refresh-tree" class="refresh-btn" title="공동 트리 새로고침" aria-label="공동 트리 새로고침">↻</button>
      <p id="persistence" class="local-note" role="status">공동 트리를 불러오는 중…</p>
    </aside>
    <div class="scene-foot" id="scene-foot">
      <div class="dock-row">
        <button id="browse" class="outline-btn ledger-btn"><span class="list-symbol" aria-hidden="true"></span>장식 목록</button>
        <div class="scene-counters"><span class="counter"><i class="bauble-symbol" aria-hidden="true"></i>장식 <strong id="orn-count">0</strong></span>
        <span class="dot-sep" aria-hidden="true">·</span><span class="counter"><i class="mail-symbol" aria-hidden="true"></i>답장 <strong id="reply-count">0</strong></span></div>
        <label class="tag-check"><input type="checkbox" id="reply-tags" checked disabled>답장 태그 보기</label>
        <span class="place-actions" id="place-actions" hidden><button class="quiet-btn" id="cancel-place">취소</button><button class="primary-btn small" id="confirm-place">여기에 걸기</button></span>
      </div>
      <span class="scene-hint" id="scene-hint">장식을 눌러 추억이나 메세지를 확인해보세요</span>
    </div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-top"><h2 id="dialog-title"></h2><button id="close-dialog" class="close-btn" aria-label="창 닫기">×</button></div>
  <div id="dialog-body"></div>
</dialog>
<dialog id="signin-dialog" aria-labelledby="signin-title">
  <div class="dialog-top"><h2 id="signin-title">연구실 Google 로그인</h2><button type="button" class="close-btn" id="cancel-signin" aria-label="로그인 닫기">×</button></div>
  <div class="signin-body form-grid">
    <p id="login-status" role="status"></p><div id="google-button"></div>
    <form id="mail-check" class="form-grid" hidden>
      <button type="button" class="secondary-btn" id="send-code">확인 메일 받기</button>
      <label class="field"><span>메일 확인 코드</span><input type="text" id="mail-code" maxlength="8" autocomplete="one-time-code" required></label>
      <button class="primary-btn" type="submit">코드 확인</button>
    </form>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript>트리에 장식을 걸려면 브라우저에서 JavaScript를 켜줘.</noscript>
<script id="asset-manifest" type="application/json">{"fir": "./assets/fir.webp", "mitten": "./assets/mitten.webp", "pinecone": "./assets/pinecone.webp", "star": "./assets/star.webp", "logo": "./assets/logo.png"}</script>
<script defer src="./config.js"></script>
<script defer src="./js/art.js"></script>
<script defer src="./js/model.js"></script>
<script defer src="./js/scene.js"></script>
<script defer src="./js/remote.js"></script>
<script defer src="./js/app.js"></script>
<script defer src="./js/glitter.js"></script>
</body>
</html>
